name: Deploy to GitHub Pages
# main に取り込まれたとき（または手動実行）に、アプリをビルドして GitHub Pages に公開する。
# 事前に Settings > Pages > Build and deployment > Source を「GitHub Actions」にしておくこと。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ビルド（/<リポジトリ名>/ 配下で動くように）
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Supabase を使う場合は Settings > Secrets and variables > Actions > Variables に登録
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - name: 秘密情報チェック
        run: bash scripts/check-secrets.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
