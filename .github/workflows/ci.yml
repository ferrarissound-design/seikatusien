name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npx tsc -b
      - name: 単体テスト
        run: npm test
      - name: Supabase SQL・RLS テスト（ローカル PostgreSQL）
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y postgresql-16 >/dev/null
          sudo PGBIN=/usr/lib/postgresql/16/bin bash scripts/test-sql.sh
      - name: 本番ビルド
        run: npm run build
      - name: 秘密情報チェック
        run: bash scripts/check-secrets.sh
      - name: ブラウザテスト
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
